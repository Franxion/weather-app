<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Severe thunderstorms · Weather Safety Quiz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style/reusable.css" />
  <link rel="stylesheet" href="style/scenario.css" />
</head>

<body class="page scenario_thunderstorms">
  <header class="scenario_header">
    <img
      class="scenario_header_scene"
      src="assets/scenario-thunderstorms.svg"
      alt=""
      width="400"
      height="240"
    />
    <div class="scenario_header_bar">
      <a class="scenario_back" href="home.html">
        <svg
          aria-hidden="true"
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M15 6l-6 6 6 6" />
        </svg>
        Scenarios
      </a>
      <p class="scenario_tag">
        03 · SEVERE THUNDERSTORMS<span class="score_long"> · SCORE 0</span>
      </p>
    </div>
  </header>

  <main class="quiz">
    <div class="quiz_card">
      <div class="quiz_status">
        <p class="quiz_count">QUESTION 01 / 03</p>
        <p class="quiz_score score_short">SCORE 0</p>
        <div
          class="quiz_progress"
          role="progressbar"
          aria-label="Question 1 of 3"
          aria-valuemin="0"
          aria-valuemax="3"
          aria-valuenow="1"
        >
          <span class="quiz_progress_step quiz_progress_step_done"></span>
          <span class="quiz_progress_step"></span>
          <span class="quiz_progress_step"></span>
        </div>
      </div>

      <form class="quiz_form">
        <h1 class="quiz_question">
          You see lightning and count 9 seconds until you hear the thunder.
          About how far away is the storm?
        </h1>

        <fieldset class="quiz_options">
          <legend class="visually_hidden">Choose one answer</legend>
          <label class="quiz_option">
            <input class="quiz_option_input" type="radio" name="answer" required value="a" />
            <span class="quiz_option_letter" aria-hidden="true">A</span>
            <span>About 3 km</span>
          </label>
          <label class="quiz_option">
            <input class="quiz_option_input" type="radio" name="answer" required value="b" />
            <span class="quiz_option_letter" aria-hidden="true">B</span>
            <span>About 9 km</span>
          </label>
          <label class="quiz_option">
            <input class="quiz_option_input" type="radio" name="answer" required value="c" />
            <span class="quiz_option_letter" aria-hidden="true">C</span>
            <span>About 30 km</span>
          </label>
        </fieldset>

        <div class="quiz_actions">
          <button disabled class="quiz_submit" type="submit">
            <span class="glow_point" aria-hidden="true"></span>
            Check answer
          </button>
        </div>
      </form>
    </div>
  </main>
  <script src="js/quiz.js"></script>
</body>
</html>
