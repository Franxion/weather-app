<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Severe thunderstorms · Weather Safety Quiz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style/reusable.css" />
    <link rel="stylesheet" href="style/scenario.css" />
  </head>

  <body class="page scenario_thunderstorms" data-scenario-id="thunderstorm">
    <header class="scenario_header">
      <img
        class="scenario_header_scene"
        src="assets/scenario-thunderstorms.svg"
        alt=""
        width="400"
        height="240"
      />
      <div class="scenario_header_bar">
        <a class="scenario_back" href="home.html">
          <svg
            aria-hidden="true"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M15 6l-6 6 6 6" />
          </svg>
          Scenarios
        </a>
        <p class="scenario_tag">
          03 · SEVERE THUNDERSTORMS<span class="score_long"> · SCORE 0</span>
        </p>
      </div>
      <div class="results_ring" hidden>
        <svg
          class="results_ring_svg"
          aria-hidden="true"
          width="160"
          height="160"
          viewBox="0 0 160 160"
        >
          <circle class="results_ring_track" cx="80" cy="80" r="68" />
          <circle
            class="results_ring_value"
            cx="80"
            cy="80"
            r="68"
            stroke-dasharray="0 427"
            transform="rotate(-90 80 80)"
          />
        </svg>
        <span class="results_ring_score">0/3</span>
        <span class="results_ring_label">CORRECT</span>
      </div>
    </header>

    <main class="quiz">
      <div class="quiz_card">
        <div class="quiz_status">
          <p class="quiz_count">QUESTION 01 / 03</p>
          <p class="quiz_score score_short">SCORE 0</p>
          <div
            class="quiz_progress"
            role="progressbar"
            aria-label="Question 1 of 3"
            aria-valuemin="0"
            aria-valuemax="3"
            aria-valuenow="1"
          >
            <span class="quiz_progress_step quiz_progress_step_done"></span>
            <span class="quiz_progress_step"></span>
            <span class="quiz_progress_step"></span>
          </div>
        </div>
        <form class="quiz_form">
          <div class="quiz_viewport">
            <div class="quiz_track"></div>
          </div>

          <div class="quiz_actions">
            <button disabled class="quiz_submit" type="submit">
              <span class="glow_point" aria-hidden="true"></span>
              <span class="quiz_submit_label">Check answer</span>
            </button>
          </div>
        </form>
      </div>
    </main>

    <main class="results" hidden>
      <div class="results_intro">
        <h1 class="results_title" tabindex="-1"></h1>
        <p class="results_message"></p>
      </div>

      <h2 class="results_section_title">WHAT TO REMEMBER</h2>
      <ul class="results_list"></ul>

      <h2 class="results_section_title">IN AN EMERGENCY</h2>
      <div class="results_card">
        <p class="results_card_text">
          Emergency numbers in Switzerland. Tap to call.
        </p>
        <div class="results_numbers">
          <a class="results_number" href="tel:112">
            <span class="results_number_value">112</span>
            <span class="results_number_label">General emergency</span>
          </a>
          <a class="results_number" href="tel:117">
            <span class="results_number_value">117</span>
            <span class="results_number_label">Police</span>
          </a>
          <a class="results_number" href="tel:118">
            <span class="results_number_value">118</span>
            <span class="results_number_label">Fire brigade</span>
          </a>
          <a class="results_number" href="tel:144">
            <span class="results_number_value">144</span>
            <span class="results_number_label">Ambulance</span>
          </a>
        </div>
      </div>

      <div class="results_actions">
        <a class="results_button" href="home.html">
          <span class="glow_point" aria-hidden="true"></span>
          Choose another scenario
        </a>
        <a
          class="results_button results_button_secondary"
          href="scenario-3.html"
        >
          <svg
            aria-hidden="true"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7" />
          </svg>
          Restart this scenario
        </a>
      </div>
    </main>

    <template id="question-template">
      <section class="quiz_slide">
        <h1 class="quiz_question" tabindex="-1"></h1>

        <fieldset class="quiz_options">
          <legend class="visually_hidden">Choose one answer</legend>
        </fieldset>
      </section>
    </template>

    <template id="option-template">
      <label class="quiz_option">
        <input class="quiz_option_input" type="radio" />
        <span class="quiz_option_letter" aria-hidden="true"></span>
        <span class="quiz_option_text"></span>
      </label>
    </template>

    <script type="module" src="js/quiz.js"></script>
  </body>
</html>
